name: Cloud Bulk Sync (Zero Local Bandwidth)

on:
  schedule:
    # Runs automatically every hour in the cloud while you sleep!
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of videos to sync in this cloud run (e.g. 50, 100)'
        required: true
        default: '50'
      workers:
        description: 'Number of parallel cloud workers'
        required: true
        default: '2'

permissions:
  contents: write
  actions: write

concurrency:
  group: cloud-bulk-sync
  cancel-in-progress: true

jobs:
  cloud_sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Cloudflare WARP SOCKS5 Proxy (YouTube Only)
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp
          sudo systemctl start warp-svc
          sleep 2
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect
          sleep 3
          echo "=== Cloudflare WARP Proxy Active on 127.0.0.1:40000 ==="
          curl -s --socks5-hostname 127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -E "ip|loc|warp" || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Deno (JavaScript Runtime for yt-dlp)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify or Install FFmpeg
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip yt-dlp
          pip install -r requirements.txt

      - name: Configure Archive.org S3 Keys
        run: |
          mkdir -p ~/.config
          echo "[s3]" > ~/.ia
          echo "access = ${{ secrets.IA_ACCESS_KEY }}" >> ~/.ia
          echo "secret = ${{ secrets.IA_SECRET_KEY }}" >> ~/.ia

      - name: YouTube Mobile Client Protocol
        run: |
          echo "Using native Android client protocol (player_skip=webpage,configs) to bypass cloud bot challenges."

      - name: Run High-Speed Bulk Sync in the Cloud
        env:
          WORKERS: ${{ github.event.inputs.workers || '2' }}
          LIMIT: ${{ github.event.inputs.limit || '50' }}
        run: |
          python bulk_sync.py --workers "$WORKERS" --limit "$LIMIT"

      - name: Clean up Cookies
        if: always()
        run: |
          rm -f cookies.txt

      - name: Commit and Push Updated Catalog & State
        run: |
          git config --global user.name "Qurani Cloud Bot"
          git config --global user.email "bot@qurani.app"
          git fetch origin master
          git pull --rebase -X ours origin master || true
          python generate_collections.py
          ia upload qurani-yasser-aldosari-prayers aldosari_prayers.json || true
          git add catalog.json sync_state.json aldosari_prayers.json last_run_stats.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: cloud sync batch completed [skip ci]" || true
            git push origin master || (git pull --rebase -X ours origin master && git push origin master)
          fi

      - name: Auto-Chain Next Batch
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import json, sys
          try:
              with open('last_run_stats.json') as f:
                  stats = json.load(f)
              new_synced = stats.get('new_synced', 0)
          except Exception:
              new_synced = 0
              
          if new_synced == 0:
              print('0 items synced in this batch (rate-limited). Pausing chain to allow cooldown.')
              sys.exit(1)
              
          with open('sync_state.json') as f:
              state = json.load(f)
              
          if len(state) < 2360:
              print(f'Batch succeeded ({new_synced} items uploaded). Auto-triggering next cloud batch...')
              sys.exit(0)
          else:
              print('All recitations have been fully synced!')
              sys.exit(1)
          " && gh workflow run "Cloud Bulk Sync (Zero Local Bandwidth)" -f limit=50 -f workers=2 || echo "Chain paused or complete."
