name: Cloud Bulk Sync (Zero Local Bandwidth)

on:
  schedule:
    # Runs automatically every hour in the cloud while you sleep!
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of videos to sync in this cloud run (e.g. 50, 100)'
        required: true
        default: '50'
      workers:
        description: 'Number of parallel cloud workers'
        required: true
        default: '2'

permissions:
  contents: write

jobs:
  cloud_sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Deno (JavaScript Runtime for yt-dlp)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip yt-dlp
          pip install -r requirements.txt

      - name: Configure Archive.org S3 Keys
        run: |
          mkdir -p ~/.config
          echo "[s3]" > ~/.ia
          echo "access = ${{ secrets.IA_ACCESS_KEY }}" >> ~/.ia
          echo "secret = ${{ secrets.IA_SECRET_KEY }}" >> ~/.ia

      - name: Inject YouTube Cookies
        run: |
          if [ -n "${{ secrets.YT_COOKIES }}" ]; then
            echo "${{ secrets.YT_COOKIES }}" | base64 --decode > cookies.txt
            echo "YouTube authentication cookies injected successfully."
          else
            echo "No YT_COOKIES secret found."
          fi

      - name: Run High-Speed Bulk Sync in the Cloud
        run: |
          python bulk_sync.py --workers ${{ github.event.inputs.workers || '2' }} --limit ${{ github.event.inputs.limit || '50' }}

      - name: Clean up Cookies
        if: always()
        run: |
          rm -f cookies.txt

      - name: Generate App Collections
        run: |
          python generate_collections.py

      - name: Commit and Push Updated Catalog & State
        run: |
          git config --global user.name "Qurani Cloud Bot"
          git config --global user.email "bot@qurani.app"
          git add catalog.json sync_state.json aldosari_prayers.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: cloud sync batch completed [skip ci]"
            git pull --rebase origin master
            git push origin master
          fi

      - name: Auto-Chain Next Batch
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python -c "
          import json, sys
          try:
              with open('last_run_stats.json') as f:
                  stats = json.load(f)
              new_synced = stats.get('new_synced', 0)
          except Exception:
              new_synced = 0
              
          if new_synced == 0:
              print('0 items synced in this batch (rate-limited). Pausing chain to allow cooldown.')
              sys.exit(1)
              
          with open('sync_state.json') as f:
              state = json.load(f)
              
          if len(state) < 2360:
              print(f'Batch succeeded ({new_synced} items uploaded). Auto-triggering next cloud batch...')
              sys.exit(0)
          else:
              print('All recitations have been fully synced!')
              sys.exit(1)
          " && gh workflow run "Cloud Bulk Sync (Zero Local Bandwidth)" -f limit=50 -f workers=2 || echo "Chain paused or complete."
