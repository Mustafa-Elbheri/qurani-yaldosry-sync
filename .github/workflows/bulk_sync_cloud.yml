name: Cloud Bulk Sync (Zero Local Bandwidth)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of videos to sync in this cloud run (e.g. 50)'
        required: true
        default: '50'
      workers:
        description: 'Number of cloud workers (1 for strictly sequential)'
        required: true
        default: '1'

permissions:
  contents: write
  actions: write

concurrency:
  group: cloud-bulk-sync
  cancel-in-progress: false

jobs:
  cloud_sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      NO_PROXY: 'archive.org,*.archive.org,s3.us.archive.org,ia601904.us.archive.org,127.0.0.1,localhost,api.ipify.org'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Cloudflare WARP SOCKS5 Proxy (YouTube Only)
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp
          sudo systemctl start warp-svc
          sleep 2
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect
          sleep 3
          echo "=== Cloudflare WARP Proxy Active on 127.0.0.1:40000 ==="
          curl -s --socks5-hostname 127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -E "ip|loc|warp" || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Deno (JavaScript Runtime for yt-dlp)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify or Install FFmpeg
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip yt-dlp
          pip install -r requirements.txt

      - name: Start BGUtil PO Token Provider (BotGuard Attestation Service)
        run: |
          docker run -d --name bgutil-pot --restart=always --net=host brainicism/bgutil-ytdlp-pot-provider:latest
          for i in {1..30}; do
            if curl -s http://127.0.0.1:4416/ping; then
              echo "BGUtil POT Provider successfully running on port 4416!"
              break
            fi
            echo "Waiting for BGUtil POT service..."
            sleep 2
          done

      - name: Configure Archive.org S3 Keys
        run: |
          mkdir -p ~/.config
          echo "[s3]" > ~/.ia
          echo "access = ${{ secrets.IA_ACCESS_KEY }}" >> ~/.ia
          echo "secret = ${{ secrets.IA_SECRET_KEY }}" >> ~/.ia

      - name: Verify Network Egress Architecture (Fixed Archive IP vs Dynamic YouTube IP)
        run: |
          echo "=========================================================="
          echo "1. Fixed Native Runner Direct IP (For Archive.org Uploads):"
          curl -s https://api.ipify.org
          echo ""
          echo "2. Dynamic Cloudflare WARP Proxy IP (For YouTube Downloads):"
          curl -s --socks5-hostname 127.0.0.1:40000 https://api.ipify.org
          echo ""
          echo "=========================================================="

      - name: "Run Strictly Sequential Bulk Sync (Batch Size 50, 1-by-1)"
        timeout-minutes: 120
        env:
          WORKERS: ${{ github.event.inputs.workers || '1' }}
          LIMIT: ${{ github.event.inputs.limit || '50' }}
        run: |
          python bulk_sync.py --workers "$WORKERS" --limit "$LIMIT"

      - name: Clean up Cookies
        if: always()
        run: |
          rm -f cookies.txt

      - name: "Wait on Same Runner IP for Archive.org Processing (Anti-Spam and Settle Grace Period)"
        if: always()
        run: |
          python wait_for_archive.py

      - name: Commit and Push Updated Catalog & State
        if: always()
        run: |
          git config --global user.name "Qurani Cloud Bot"
          git config --global user.email "bot@qurani.app"
          git fetch origin master
          git pull --rebase -X ours origin master || true
          python generate_collections.py
          python upload_collections.py || true
          git add catalog.json sync_state.json aldosari_prayers.json last_run_stats.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: cloud sync batch (50 recitations) completed [skip ci]" || true
            git push origin master || (git pull --rebase -X ours origin master && git push origin master)
          fi

      - name: Auto-Chain Next Batch (Self-Healing Loop)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import json, sys, time, subprocess

          try:
              with open('sync_state.json', 'r', encoding='utf-8') as f:
                  state = json.load(f)
              total_synced = len(state)
          except Exception:
              total_synced = 0

          print(f'Current total synced items in state: {total_synced}')

          if total_synced >= 2360:
              print('🎉 Entire channel is completely synced! All recitations are on Archive.org.')
              print('Auto-chain successfully completed. No more batches needed.')
              sys.exit(0)

          try:
              with open('last_run_stats.json', 'r', encoding='utf-8') as f:
                  stats = json.load(f)
              new_synced = stats.get('new_synced', 0)
              queue_limited = stats.get('queue_limited', False)
          except Exception:
              new_synced = 0
              queue_limited = False

          print(f'Newly synced in this run: {new_synced} | Archive Queue Limited: {queue_limited}')
          if queue_limited or new_synced == 0:
              print('Archive.org queue saturation detected (cooldown needed).')
              print('Sleeping 300s (5 mins) in the cloud runner to allow Archive.org task queue to drain...')
              time.sleep(300)
              print('Cooldown complete! Resuming cloud chain now...')
          else:
              print(f'Batch succeeded with {new_synced} recitations. Waiting 20s before launching next sequential batch of 50...')
              time.sleep(20)

          # Trigger next strictly sequential batch of 50 (workers=1) via GitHub CLI
          res = subprocess.run([
              'gh', 'workflow', 'run', 'bulk_sync_cloud.yml',
              '-f', 'limit=50',
              '-f', 'workers=1'
          ], capture_output=True, text=True)
          print('Trigger status code:', res.returncode)
          print('Output:', res.stdout)
          if res.stderr:
              print('Error output:', res.stderr)
          " || echo "Auto-chain step concluded."
